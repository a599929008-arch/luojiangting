<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>·</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="secret">

  <div class="lock-screen" id="lockScreen">
    <div class="lock-box">
      <div class="lock-mark">· · ·</div>
      <p class="lock-title">这里有一些话，<br>只想给一个人看。</p>
      <form class="lock-form" autocomplete="off">
        <input class="lock-input" type="password" inputmode="numeric" placeholder="请输入密码" autocomplete="off">
        <button class="lock-submit" type="submit">进入</button>
        <div class="lock-error"></div>
      </form>
      <div class="lock-hint">你应该知道这个数字。</div>
    </div>
  </div>

  <div class="secret">
    <div class="letter-nav-top"><a class="back-link" href="index.html">← 返回</a></div>
    <div class="secret-inner">

      <p class="secret-intro reveal" id="secretIntro"></p>

      <!-- 彩蛋 1：密码 -->
      <div class="egg reveal">
        <div class="egg-hint" id="egg1Hint"></div>
        <form class="egg-form" id="egg1Form" autocomplete="off">
          <input class="egg-input" id="egg1Input" type="text" placeholder="答案" autocomplete="off">
          <button class="egg-btn" type="submit">确认</button>
        </form>
        <div class="egg-reveal" id="egg1Reveal"></div>
      </div>

      <!-- 彩蛋 2：戳一戳拼豆 -->
      <div class="egg reveal">
        <div class="egg-hint" id="egg2Caption"></div>
        <div class="egg-bead" id="egg2Bead"></div>
        <div class="egg-reveal" id="egg2Reveal"></div>
      </div>

      <!-- 彩蛋 3：深夜时间 -->
      <div class="egg reveal">
        <div class="egg-clock" id="egg3Clock"></div>
        <div class="egg-reveal" id="egg3Reveal"></div>
      </div>

      <!-- 彩蛋 4：连续点击 -->
      <div class="egg reveal">
        <div class="egg-dot" id="egg4Dot"></div>
        <div class="egg-dot-hint">· </div>
        <div class="egg-reveal" id="egg4Reveal"></div>
      </div>

      <!-- 彩蛋 5：最终 -->
      <div class="egg reveal">
        <div class="egg-final-end" id="egg5End">
          <span id="egg5EndText"></span>
        </div>
        <div class="egg-final-teaser" id="egg5Teaser"></div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
