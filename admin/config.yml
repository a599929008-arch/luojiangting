backend:
  name: git-gateway
  branch: main

# 网站没有构建步骤，直接编辑 content.json 这一个数据文件
media_folder: ""
public_folder: ""

collections:
  - name: "content"
    label: "网站文案"
    files:
      - file: "content.json"
        label: "全部内容"
        name: "site_content"
        fields:

          - label: "网站设置"
            name: "site"
            widget: object
            fields:
              - { label: "访问密码", name: "password", widget: string }
              - { label: "称呼（TO 后面的名字）", name: "toName", widget: string }
              - { label: "日期（格式如 2026-08-13）", name: "date", widget: string }
              - { label: "落款名字", name: "fromName", widget: string }

          - label: "首页目录"
            name: "index"
            widget: object
            fields:
              - { label: "封面那句话", name: "tagline", widget: string }
              - { label: "按钮文字", name: "openButton", widget: string }
              - label: "六个条目（id 不要改）"
                name: "entries"
                widget: list
                fields:
                  - { label: "id（对应文件名，不要改）", name: "id", widget: string }
                  - { label: "编号", name: "num", widget: string }
                  - { label: "标题", name: "title", widget: string }
                  - { label: "副标题", name: "subtitle", widget: string, required: false }

          - label: "01 以前的你"
            name: "past"
            widget: object
            fields:
              - { label: "编号", name: "num", widget: string }
              - { label: "标题", name: "title", widget: string }
              - { label: "副标题", name: "subtitle", widget: string }
              - label: "正文段落"
                name: "paragraphs"
                widget: list
                field: { label: "段落", name: "text", widget: text }
              - { label: "结尾第一行", name: "closingLine1", widget: string }
              - { label: "结尾第二行", name: "closingLine2", widget: string }

          - label: "02 现在的你"
            name: "present"
            widget: object
            fields:
              - { label: "编号", name: "num", widget: string }
              - { label: "标题", name: "title", widget: string }
              - { label: "副标题", name: "subtitle", widget: string }
              - label: "正文段落"
                name: "paragraphs"
                widget: list
                field: { label: "段落", name: "text", widget: text }
              - label: "聊天记录（可选，不填就不显示）"
                name: "chatLog"
                widget: list
                required: false
                fields:
                  - { label: "发送方", name: "sender", widget: select, options: ["me", "her"] }
                  - { label: "内容", name: "text", widget: string }

          - label: "03 以后的你"
            name: "future"
            widget: object
            fields:
              - { label: "编号", name: "num", widget: string }
              - { label: "标题", name: "title", widget: string }
              - { label: "副标题", name: "subtitle", widget: string }
              - label: "正文段落"
                name: "paragraphs"
                widget: list
                field: { label: "段落", name: "text", widget: text }
              - label: "未来时间轴"
                name: "timeline"
                widget: list
                fields:
                  - { label: "年份", name: "year", widget: string }
                  - { label: "备注", name: "note", widget: string, required: false }

          - label: "04 我想对你说"
            name: "words"
            widget: object
            fields:
              - { label: "编号", name: "num", widget: string }
              - { label: "标题", name: "title", widget: string }
              - { label: "副标题", name: "subtitle", widget: string }
              - label: "正文（可以很长）"
                name: "paragraphs"
                widget: list
                field: { label: "段落", name: "text", widget: text }

          - label: "05 生日快乐"
            name: "birthday"
            widget: object
            fields:
              - { label: "编号", name: "num", widget: string }
              - { label: "引导句 1", name: "lead1", widget: string }
              - { label: "引导句 2", name: "lead2", widget: string }
              - { label: "引导句 3（生日快乐那句）", name: "lead3", widget: string }
              - label: "祝福段落"
                name: "paragraphs"
                widget: list
                field: { label: "段落", name: "text", widget: text }
              - { label: "结尾祝福语", name: "closing", widget: string }

          - label: "06 隐藏彩蛋"
            name: "secret"
            widget: object
            fields:
              - { label: "开场白", name: "intro", widget: string }
              - { label: "彩蛋①提示语", name: "passwordHint", widget: string }
              - { label: "彩蛋①密码", name: "password", widget: string }
              - { label: "彩蛋①解锁后内容", name: "passwordMessage", widget: text }
              - { label: "彩蛋②提示语（戳豆子）", name: "beadCaption", widget: string }
              - { label: "彩蛋②内容", name: "beadStory", widget: text }
              - { label: "彩蛋③时间显示", name: "midnightTime", widget: string }
              - { label: "彩蛋③内容", name: "midnightMessage", widget: text }
              - { label: "彩蛋④内容（连续点击后）", name: "hiddenMessage", widget: text }
              - { label: "彩蛋⑤引子", name: "finalTeaser", widget: string }
              - { label: "彩蛋⑤最终内容", name: "finalMessage", widget: text }
