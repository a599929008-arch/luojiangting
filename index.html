<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>有一些话，我想留在这里给你</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="style.css">
</head>
<body data-page="index">

  <!-- 密码门 -->
  <div class="lock-screen" id="lockScreen" hidden>
    <div class="lock-box">
      <div class="lock-mark">· · ·</div>
      <p class="lock-title">这里有一些话，<br>只想给一个人看。</p>
      <form class="lock-form" id="lockForm" autocomplete="off">
        <input class="lock-input" id="lockInput" type="password" inputmode="numeric" placeholder="请输入密码" autocomplete="off">
        <button class="lock-submit" type="submit">进入</button>
        <div class="lock-error" id="lockError"></div>
      </form>
      <div class="lock-hint">你应该知道这个数字。</div>
    </div>
  </div>

  <!-- 封面 -->
  <div class="cover" id="cover">
    <div class="cover-inner">
      <div class="cover-to" id="coverTo">TO ·</div>
      <div class="cover-date" id="coverDate"></div>
      <p class="cover-line" id="coverLine"></p>
      <button class="cover-open" id="openGift"></button>
    </div>
  </div>

  <!-- 目录 -->
  <div class="directory" id="directory" hidden>
    <div class="directory-title">TABLE OF LETTERS</div>
    <div class="entry-list" id="entryList"></div>
    <div class="ps-link" id="psLink">彩蛋 🥚</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
